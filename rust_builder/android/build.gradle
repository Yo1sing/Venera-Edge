// The Android Gradle Plugin builds the native code with the Android NDK.

group = 'com.flutter_rust_bridge.venera_backend'
version = '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

def appAndroid = rootProject.project(":app").android

android {
    namespace = 'com.flutter_rust_bridge.venera_backend'
    compileSdk = appAndroid.compileSdk
    ndkVersion = appAndroid.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdk = 19
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../../rust"
    libname = "venera_backend"
}
