/// This is copied from Cargokit (which is the official way to use it currently)
/// Details: https://fzyzcjy.github.io/flutter_rust_bridge/manual/integrate/builtin

import java.nio.file.Paths
import javax.inject.Inject
import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.FileSystemOperations
import org.gradle.process.ExecOperations

CargoKitPlugin.file = buildscript.sourceFile

apply plugin: CargoKitPlugin

class CargoKitExtension {
    String manifestDir; // Relative path to folder containing Cargo.toml
    String libname; // Library name within Cargo.toml. Must be a cdylib
}

abstract class CargoKitBuildTask extends DefaultTask {
    @Inject
    abstract ExecOperations getExecOperations()

    @Inject
    abstract FileSystemOperations getFileSystemOperations()

    @Input
    String buildMode

    @Input
    String buildDir

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @Input
    String ndkVersion

    @Input
    String sdkDirectory

    @Input
    int compileSdkVersion;

    @Input
    int minSdkVersion;

    @Input
    String pluginFile

    @Input
    List<String> targetPlatforms

    @TaskAction
    def build() {
        if (project.cargokit.manifestDir == null) {
            throw new GradleException("Property 'manifestDir' must be set on cargokit extension");
        }

        if (project.cargokit.libname == null) {
            throw new GradleException("Property 'libname' must be set on cargokit extension");
        }

        def executableName = Os.isFamily(Os.FAMILY_WINDOWS) ? "run_build_tool.cmd" : "run_build_tool.sh"
        def path = Paths.get(new File(pluginFile).parent, "..", executableName);

        def manifestDir = Paths.get(project.buildscript.sourceFile.parent, project.cargokit.manifestDir)

        def rootProjectDir = project.rootProject.projectDir
        def localProperties = new Properties()
        project.rootProject.file("local.properties").withInputStream { localProperties.load(it) }
        def generatedJniLibs = outputDir.get().asFile.canonicalFile
        def projectBuildPath = project.layout.buildDirectory.get().asFile.canonicalFile.toPath()
        def outputPath = generatedJniLibs.toPath()
        if (outputPath == projectBuildPath || !outputPath.startsWith(projectBuildPath)) {
            throw new GradleException("CargoKit JNI output must be inside the project build directory.")
        }

        // A build with a different target-platform selection must not retain old ABI outputs.
        fileSystemOperations.delete { delete generatedJniLibs }

        if (!Os.isFamily(Os.FAMILY_WINDOWS)) {
            execOperations.exec {
                commandLine 'chmod', '+x', path
            }
        }

        execOperations.exec {
            executable path
            args "build-gradle"
            environment "FLUTTER_ROOT", localProperties.getProperty("flutter.sdk")
            environment "CARGOKIT_ROOT_PROJECT_DIR", rootProjectDir
            environment "CARGOKIT_TOOL_TEMP_DIR", "${buildDir}/build_tool"
            environment "CARGOKIT_MANIFEST_DIR", manifestDir
            environment "CARGOKIT_CONFIGURATION", buildMode
            environment "CARGOKIT_TARGET_TEMP_DIR", buildDir
            environment "CARGOKIT_OUTPUT_DIR", generatedJniLibs
            environment "CARGOKIT_NDK_VERSION", ndkVersion
            environment "CARGOKIT_SDK_DIR", sdkDirectory
            environment "CARGOKIT_COMPILE_SDK_VERSION", compileSdkVersion
            environment "CARGOKIT_MIN_SDK_VERSION", minSdkVersion
            environment "CARGOKIT_TARGET_PLATFORMS", targetPlatforms.join(",")
            environment "CARGOKIT_JAVA_HOME", System.properties['java.home']
        }
    }
}

class CargoKitPlugin implements Plugin<Project> {

    static String file

    @Override
    void apply(Project project) {
        project.extensions.create("cargokit", CargoKitExtension)

        def flutterProject = project.rootProject.allprojects.find {
            it.pluginManager.hasPlugin("dev.flutter.flutter-gradle-plugin")
        }
        if (flutterProject == null) {
            print("Flutter plugin not found, CargoKit plugin will not be applied.")
            return
        }

        def cargoBuildDir = "${project.buildDir}/build"
        def flutterAndroid = flutterProject.extensions.getByName("android")
        def androidComponents = project.extensions.getByName("androidComponents")
        def androidSdkDir = androidComponents.sdkComponents.sdkDirectory

        androidComponents.onVariants(androidComponents.selector().all()) { variant ->
            def buildType = variant.buildType
            def platforms = com.flutter.gradle.FlutterPluginUtils.getTargetPlatforms(project).collect()

            // Same thing addFlutterDependencies does in flutter.gradle
            if (buildType == "debug") {
                platforms.add("android-x86")
                platforms.add("android-x64")
            }

            // Flutter already lists the device ABI, so the debug additions above
            // can duplicate it. Cargokit builds every entry without deduplicating.
            platforms = platforms.unique()

            if (flutterAndroid.ndkVersion == null) {
                throw new GradleException("Please set 'android.ndkVersion' in 'app/build.gradle'.")
            }

            def taskName = "cargokitCargoBuild${project.cargokit.libname.capitalize()}${variant.name.capitalize()}"
            def cargoBuildTask = project.tasks.register(taskName, CargoKitBuildTask) {
                buildMode = buildType
                buildDir = cargoBuildDir
                ndkVersion = flutterAndroid.ndkVersion
                sdkDirectory = androidSdkDir.get().asFile.absolutePath
                minSdkVersion = flutterAndroid.defaultConfig.minSdk
                compileSdkVersion = flutterAndroid.compileSdk
                targetPlatforms = platforms
                pluginFile = CargoKitPlugin.file
                // Cargo tracks Rust inputs independently of Gradle.
                outputs.upToDateWhen { false }
            }
            variant.sources.jniLibs.addGeneratedSourceDirectory(cargoBuildTask) { task ->
                task.outputDir
            }
        }
    }
}
